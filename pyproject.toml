[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zephil"
version = "0.1.0"
description = "A pytest plugin for Zephyr Hardware-in-the-Loop testing"
readme = "README.md"
authors = [{ name = "Toon Stegen", email = "toon@toostsolutions.be" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "pyserial>=3.5",
    "pylink-square>=1.0",
]

[project.urls]
Homepage = "https://github.com/toonst/zepHIL"

[project.entry-points.pytest11]
zephil = "zephil.plugin"

# The modules live in the repository root, which is itself the `zephil` package.
[tool.setuptools]
packages = ["zephil"]
package-dir = { zephil = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
